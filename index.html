<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florenza Bijouterias | Beleza · Estilo · Você</title>
    <meta name="description" content="Acessórios exclusivos Florenza Bijouterias com caixinhas personalizadas e acabamento premium.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700&family=Galada&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <!-- Tela de Loading Funcional (aguarda catálogo + modelo 3D) -->
    <div id="preloaderFlorenza" class="preloader-overlay" aria-live="polite">
        <div class="preloader-box">
            <div class="preloader-crown">♔</div>
            <div class="preloader-monogram">F</div>
            <h2 class="preloader-title">FLORENZA</h2>
            <span class="preloader-sub">BIJOUTERIAS</span>
            <p id="preloaderStatus" class="preloader-status">Conectando à vitrine...</p>
            <div class="preloader-bar">
                <div id="preloaderBarFill" class="preloader-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Partículas / Brilhos Subindo ao Fundo -->
    <div id="bubbles-container"></div>

    <!-- Cabeçalho Glassmorphism -->
    <header class="header" id="navbar">
        <a href="#" class="logo" onclick="fecharModaisAtivos(); return false;">
            <span class="logo-crown">♔</span>
            <span>Florenza</span>
        </a>

        <nav class="nav glass" id="navGlass">
            <a href="#" class="nav-item active" onclick="fecharBuscaTopo(); return false;">Vitrine</a>
            <button type="button" class="nav-item nav-btn-reset" onclick="abrirBuscaTopo()">🔍 Buscar</button>
            <button type="button" class="nav-item nav-btn-reset" onclick="abrirCarrinho()">
                🛍️ Sacola (<span id="contadorCarrinho">0</span>)
            </button>
            <button type="button" class="nav-item nav-btn-reset" id="btnNavAdmin" onclick="abrirModalAdmin()">Admin</button>
        </nav>

        <!-- Barra de Busca Expansível no Topo -->
        <div class="search-expand-bar" id="searchInputWrap" style="display: none;">
            <input type="text" id="inputBusca" oninput="filtrarProdutos()" placeholder="Buscar peça na coleção Florenza..." autocomplete="off">
            <button type="button" class="search-close-btn" onclick="fecharBuscaTopo()" aria-label="Fechar busca">&times;</button>
        </div>

        <button type="button" class="contact-btn" onclick="abrirCarrinho()">Finalizar Pedido</button>
    </header>

    <!-- Palco Principal 3D Interativo -->
    <main class="hero">
        <div class="hero-content">
            <!-- Camada Distante (Parallax Suave) -->
            <div class="leaves-container">
                <model-viewer class="leaf l1" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/IridescenceAbalone/glTF-Binary/IridescenceAbalone.glb" environment-image="neutral" exposure="1.1" interaction-prompt="none" camera-orbit="45deg 75deg 115%"></model-viewer>
                <model-viewer class="leaf l2" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/IridescenceAbalone/glTF-Binary/IridescenceAbalone.glb" environment-image="neutral" exposure="1.1" interaction-prompt="none" camera-orbit="-30deg 60deg 115%"></model-viewer>
                <model-viewer class="leaf l3" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/IridescenceAbalone/glTF-Binary/IridescenceAbalone.glb" environment-image="neutral" exposure="1.1" interaction-prompt="none" camera-orbit="120deg 85deg 115%"></model-viewer>
                <model-viewer class="leaf l4" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/IridescenceAbalone/glTF-Binary/IridescenceAbalone.glb" environment-image="neutral" exposure="1.1" interaction-prompt="none" camera-orbit="10deg 45deg 115%"></model-viewer>
            </div>

            <!-- Coluna Esquerda -->
            <div class="hero-left">
                <h1 class="main-title" id="heroTituloCursivo">
                    <span class="outline" id="heroLinha1">Pure</span><br>
                    <span id="heroLinha2">Brilho</span>
                </h1>

                <p class="description" id="heroDescricao">
                    Detalhes que fazem você ainda mais única. <br>
                    Escolha sua peça, personalize caixinha ou sacola <br>
                    e receba com um mimo especial Florenza.
                </p>

                <div class="hero-price-pill">
                    <strong id="heroPrecoAtivo">R$ 0,00</strong>
                    <span id="heroPrecoAntigoAtivo" class="old-price-tag" style="display: none;"></span>
                    <button type="button" id="btnCurtirAtivo" class="like-pill-btn">♥ <span id="focoLikes">0</span></button>
                </div>

                <div class="cta-group">
                    <button type="button" class="primary-btn" onclick="abrirModalPersonalizacao()">
                        Personalizar
                        <span class="plus-icon">+</span>
                    </button>
                </div>

                <div class="award-badge">
                    <div class="award-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 15L15 18L19 14" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M7 10L12 15L17 10" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">FLORENZA ATELIER</span>
                        <span class="award-subtitle">COLEÇÃO EXCLUSIVA 2026</span>
                    </div>
                </div>
            </div>

            <!-- Elementos Flutuantes de Fundo -->
            <div class="berries-container-bg">
                <model-viewer class="berry b7" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-20deg 110deg 120%"></model-viewer>
                <model-viewer class="berry b8" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="160deg 45deg 120%"></model-viewer>
                <model-viewer class="berry b9" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 20deg 120%"></model-viewer>
            </div>

            <!-- Produto Central 3D -->
            <div class="hero-center">
                <model-viewer id="product-model"
                    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/IridescentDishWithOlives/glTF-Binary/IridescentDishWithOlives.glb"
                    alt="Modelo 3D Florenza Bijouterias"
                    camera-controls
                    disable-zoom
                    shadow-intensity="0"
                    environment-image="neutral"
                    exposure="1.4"
                    interaction-prompt="none"
                    camera-orbit="0deg 75deg 240%"
                    field-of-view="30deg"
                    class="main-product-3d">
                </model-viewer>
            </div>

            <!-- Elementos Flutuantes de Primeiro Plano (Repulsão pelo Cursor) -->
            <div class="berries-container">
                <model-viewer class="berry b1" src="
