<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>🛍️ Minha Loja Virtual</h1>
        <div id="statusLogin">
            <!-- Botão de Login/Logout dinâmico -->
        </div>
    </header>

    <main class="container">
        <!-- Formulário de Login Modal/Oculto -->
        <section id="secaoLogin" class="card" style="display: none;">
            <h2>Área do Administrador</h2>
            <div class="form-group">
                <input type="email" id="emailLogin" placeholder="Email do administrador">
                <input type="password" id="senhaLogin" placeholder="Palavra-passe">
                <button onclick="fazerLogin()" class="btn-success">Entrar</button>
            </div>
        </section>

        <!-- Painel de Adicionar Produtos (Só visível para Admin logado) -->
        <section id="secaoAdmin" class="card admin-panel" style="display: none;">
            <h2>➕ Adicionar Novo Produto</h2>
            <div class="form-group">
                <input type="text" id="nomeProduto" placeholder="Nome do produto...">
                <input type="text" id="precoProduto" placeholder="Preço (ex: 19.99 €)">
                <button onclick="adicionarProduto()" class="btn-primary">Cadastrar Produto</button>
            </div>
            <button onclick="fazerLogout()" class="btn-danger btn-sm">Sair do Modo Admin</button>
        </section>

        <!-- Catálogo de Produtos da Loja -->
        <section class="catalogo-secao">
            <h2>Catálogo de Produtos</h2>
            <div id="gridProdutos" class="grid-produtos">
                <!-- Os produtos vão aparecer em cartões aqui -->
            </div>
        </section>
    </main>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
